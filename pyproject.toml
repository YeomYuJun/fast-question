# PC 클라이언트 패키지(fast-question). 원격 서버를 쓰는 로컬 프록시 MCP·즉석 질문 훅·초안 검사 명령이다.
# 서버(web/, run_web.py, Kiwi)는 이 패키지에 들어가지 않는다. 서버 설치는 requirements*.txt 를 쓴다.
# 근거 캡처·판정(kb/evidence.py)을 서버와 같은 파일로 쓰려고 저장소의 모듈을 그 이름 그대로 담는다.
# 담는 파일은 아래 only-include 목록뿐이다. 클라이언트 진입점이 import 하는 모듈이 이 목록 밖에 있으면
# tests/test_client_package.py 가 실패한다.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fast-question"
dynamic = ["version"]
description = "fast-question PC client: local MCP proxy, prompt hook and draft linter for a remote fast-question server"
requires-python = ">=3.12"
# 프록시(mcp_server/proxy.py)가 직접 import 하는 것. 테스트를 돌리는 저장소 가상환경(.venv)과 같은 버전으로 둔다
dependencies = ["mcp==2.0.0", "anyio==4.14.2", "httpx2==2.13.1"]

[project.scripts]
fast-question = "fq_client.cli:main"

[tool.hatch.version]
path = "fq_client/__init__.py"

[tool.hatch.build.targets.wheel]
only-include = [
    "fq_client/__init__.py",
    "fq_client/cli.py",
    "fq_client/lint_draft.py",
    "fq_client/login.py",
    "hooks/__init__.py",
    "hooks/ask_kb.py",
    "kb/__init__.py",
    "kb/config.py",
    "kb/errors.py",
    "kb/evidence.py",
    "kb/remote.py",
    "kb/rules.py",
    "kb/text.py",
    "mcp_server/__init__.py",
    "mcp_server/instructions.py",
    "mcp_server/proxy.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "pyproject.toml",
    "fq_client/__init__.py",
    "fq_client/cli.py",
    "fq_client/lint_draft.py",
    "fq_client/login.py",
    "hooks/__init__.py",
    "hooks/ask_kb.py",
    "kb/__init__.py",
    "kb/config.py",
    "kb/errors.py",
    "kb/evidence.py",
    "kb/remote.py",
    "kb/rules.py",
    "kb/text.py",
    "mcp_server/__init__.py",
    "mcp_server/instructions.py",
    "mcp_server/proxy.py",
]
