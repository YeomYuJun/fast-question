<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fast-question</title>
<script>
// 테마는 그리기 전에 정한다. 저장값이 없으면 OS 설정을 따른다
(function () {
  var t = null;
  try { t = localStorage.getItem("fq-theme"); } catch (e) { t = null; }
  if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">?</span><span>fast-question</span></div>
  <button id="toggle-side" class="navbtn" type="button" aria-pressed="false" aria-controls="side">분류</button>
  <div class="grow"></div>
  <span class="keys">/ 검색 · ↑↓ 이동 · Enter 펼치기 · E 편집 · Esc 지우기</span>
  <button id="new-btn" class="btn primary" type="button">+ 새 질문</button>
  <button id="theme-btn" class="iconbtn" type="button" aria-label="테마 바꾸기">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg>
  </button>
</header>

<div class="layout">
  <aside id="side" class="side" hidden>
    <div class="side-head">
      <span class="label">분류</span>
      <button id="cat-edit" class="navbtn small" type="button" aria-pressed="false">분류 편집</button>
    </div>
    <nav id="cat-tree" class="tree" aria-label="분류"></nav>
    <form id="cat-form" class="cat-form" hidden>
      <input id="cat-name" class="fld" aria-label="새 분류 이름" placeholder="이름 (중분류는 대분류 > 이름)" autocomplete="off">
      <div class="cat-form-btns">
        <button class="btn primary" type="submit">추가</button>
        <button id="cat-cancel" class="btn" type="button">취소</button>
      </div>
    </form>
    <button id="cat-add" class="dashed" type="button">+ 분류 추가</button>
  </aside>

  <main class="main">
    <div class="col">
      <div id="search" class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="무엇이 궁금한가요?  예) rename 원자적" aria-label="질문·답변 검색" autocomplete="off" spellcheck="false">
        <button id="help-btn" class="ibtn help" type="button" aria-label="검색 문법 보기" title="검색 문법" aria-expanded="false" aria-controls="help"></button>
        <div id="help" class="help-pop" role="dialog" aria-label="검색 문법" hidden>
          <table>
            <tr><td><code>a b</code></td><td>모두 든 항목 (공백은 AND)</td></tr>
            <tr><td><code>a | b</code></td><td>둘 중 하나가 든 항목 (OR)</td></tr>
            <tr><td><code>-a</code></td><td>a 가 든 항목을 뺀다</td></tr>
            <tr><td><code>"a b"</code></td><td>공백을 포함한 구절</td></tr>
            <tr><td><code>q:a</code> <code>a:a</code></td><td>질문에서만, 답변에서만 찾는다</td></tr>
            <tr><td><code>path:x</code></td><td>근거 파일 경로에 x 가 든 항목</td></tr>
          </table>
        </div>
      </div>
      <div class="summary">
        <span id="sum-count"></span>
        <button id="cat-chip" class="chip on" type="button" hidden></button>
        <span id="sum-note" class="note"></span>
        <span id="sum-ms" class="ms"></span>
      </div>
      <div id="new-slot"></div>
      <div id="empty" class="empty" hidden>
        <span id="empty-msg">일치하는 질문이 없습니다.</span>
        <button id="empty-new" class="btn" type="button"></button>
      </div>
      <div id="results"></div>
    </div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
