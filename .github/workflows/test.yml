# 전체 테스트(Linux). feat/service 에 push 하면 돌고, deploy.yml(main)·publish-client.yml(태그)이 앞 단계로 부른다.
name: test

on:
  push:
    branches: [feat/service]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-server.txt
      - run: python -m pytest -q

  # 화면 테스트(실제 Chromium). Linux 러너에서 통과가 확인될 때까지는 실패해도 배포·게시를 막지 않는다
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-server.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_e2e_screen.py tests/test_e2e_remote.py
