# 인스턴스 1대 구성: app(fast-question) + caddy(HTTPS 인증서 자동 발급, 역방향 프록시).
# deploy/ 폴더에서 실행한다. config.json 은 config.example.json 을 복사해 만든다(git 에 올리지 않는다).
# 비밀값은 같은 폴더의 .env 파일이나 셸 환경 변수로 넘긴다. AWS 키가 필요한 환경(인스턴스 역할이 없는 경우)은
# aws.env 파일에 AWS_ACCESS_KEY_ID·AWS_SECRET_ACCESS_KEY 를 적는다(없으면 건너뛴다).
# 컨테이너 표준 출력 로그는 서비스마다 10 MB × 3 개까지만 둔다(Docker 기본값은 상한이 없다)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: fast-question:latest
    restart: unless-stopped
    logging: *logging
    environment:
      FQ_GITHUB_SECRET: ${FQ_GITHUB_SECRET:-}
      FQ_GOOGLE_SECRET: ${FQ_GOOGLE_SECRET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
    env_file:
      - path: ./aws.env
        required: false
    volumes:
      - fq-data:/data
      - ./config.json:/etc/fq/config.json:ro
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    environment:
      FQ_DOMAIN: ${FQ_DOMAIN:?deploy/.env 에 FQ_DOMAIN(예 fast-question.com)을 적는다}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fq-data:
  caddy-data:
  caddy-config:
